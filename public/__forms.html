<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Forms</title><meta name="robots" content="noindex" /></head>
  <body>
    <!-- Netlify Forms detection: the real form lives in components/sections/QuoteForm.tsx and posts here.
         Set the notification email in Netlify > Forms > quote. -->
    <form name="quote" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="name" />
      <input name="company" />
      <input name="phone" />
      <input name="email" />
      <input name="family" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
